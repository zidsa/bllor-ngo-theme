name: Trigger Deploy

# Asks zidsa/deploy-vitrin-themes to publish this theme: develop goes to staging and
# main to production, using the theme ids for this repository in its theme_mappings.json.
on:
  push:
    branches: [develop, main]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DEPLOY_REPO_PAT }}
          repository: zidsa/deploy-vitrin-themes
          event-type: source-updated
          client-payload: '{"repository": "${{ github.repository }}", "ref": "${{ github.ref_name }}"}'
